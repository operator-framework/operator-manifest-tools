name: Go

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Tidy
        run: make tidy

      - name: Vet
        run: make vet

      - name: Format
        run: make fmt

      - name: Run golangci linting checks
        run: make lint

      - name: Build
        run: go build -v ./...

      - name: Test
        run: make test
